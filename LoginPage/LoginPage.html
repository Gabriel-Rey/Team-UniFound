<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>UniFound -Lost and Found | Login Portal</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">
  <div class="main-title">UniFound</div>

<div class="login-container">
  <div class="login-grid">
    <!-- LEFT SIDE: LOGIN FORM -->
    <div class="form-section">
      <div class="login-title">Login</div>
      <div class="login-sub">Access your lost & found dashboard</div>

      <!-- Login form (Sign In) -->
      <form id="signinForm" action="#" method="post">
        <div class="input-group">
          <label><i class="far fa-user-circle" style="margin-right: 6px;"></i> User Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="username" name="username" placeholder="john_doe or email@example.com" autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="input-wrapper">
            <i class="fas fa-key"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-signin" id="signInBtn">Sign In</button>
          <button type="button" class="btn btn-signup" id="signUpBtn">Sign Up</button>
        </div>

        <div class="forgot-link">
          <a href="#" id="forgotPasswordLink">forget Password ?</a>
        </div>

        <!-- hidden toast / demo feedback -->
        <div id="formFeedback" class="toast-msg"></div>
        <div class="demo-hint">
          <i class="fas fa-info-circle"></i> Demo: use any credentials (frontend simulation)
        </div>
      </form>
    </div>

    <!-- RIGHT SIDE: HELP + CONTACT & COPYRIGHT -->
    <div class="info-section">
      <div>
        <div class="help-heading">
          <i class="fas fa-life-ring" style="font-size: 1.8rem; vertical-align: middle; margin-right: 8px; color: #e2b13b;"></i> 
          Help
        </div>
        <ul class="help-links">
          <li><a href="#" class="help-link-item" data-help="Customer Support"><i class="fas fa-headset"></i> Customer Support</a></li>
          <li><a href="#" class="help-link-item" data-help="Terms & Conditions"><i class="fas fa-file-contract"></i> Terms & Conditions</a></li>
          <li><a href="#" class="help-link-item" data-help="Privacy Policy"><i class="fas fa-shield-alt"></i> Privacy Policy</a></li>
        </ul>
      </div>

      <!-- contact area exactly as design: Tel, Email -->
      <div class="contact-details">
        <p><i class="fas fa-phone-alt"></i> Tel: <a href="tel:+94716520890">+94 716520890</a></p>
        <p><i class="fas fa-envelope"></i> Email: <a href="mailto:UniFound@gmail.com">UniFound@gmail.com</a></p>
      </div>

      <!-- copyright notice as per design -->
      <div class="copyright">
        <p>© Copyright 2024 Lost and Found</p>
        <p>All Right Reserved</p>
      </div>
    </div>
  </div>
</div>

<!-- External JavaScript -->
<script src="script.js"></script>
</body>
</html>
